<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover,
                 interactive-widget=resizes-content, user-scalable=no">
  <title>一念逍遥，一念合欢</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./ui.css">
</head>
<body>
  <main id="game-shell">
    <div id="game-container" aria-label="游戏画面"></div>
    <section id="model-panel" class="model-panel" hidden>
      <button id="model-panel-toggle" class="model-panel-toggle" type="button"
              aria-label="打开设置" aria-controls="model-panel-content"
              title="设置">&#9881;</button>
      <div id="model-panel-content" class="model-panel-content" hidden>
        <strong>设置</strong>
        <div class="settings-row">
          <span>
            <b>声音</b>
            <small id="audio-state">已开启</small>
          </span>
          <label class="settings-switch" title="切换声音">
            <input id="audio-toggle" type="checkbox" checked aria-label="启用游戏声音">
            <span class="settings-switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <div class="settings-orientation">
          <span>
            <b>显示方向</b>
            <small id="orientation-status" aria-live="polite">跟随当前屏幕</small>
          </span>
          <div class="orientation-segment" role="group" aria-label="切换显示方向">
            <button type="button" data-orientation="landscape" aria-pressed="false">横屏</button>
            <button type="button" data-orientation="portrait" aria-pressed="false">竖屏</button>
          </div>
        </div>
        <label class="settings-field">
          <span>对话模型</span>
          <select id="dialogue-model" aria-label="对话模型"></select>
        </label>
        <label class="settings-field">
          <span>绘图模型</span>
          <select id="draw-model" aria-label="绘图模型"></select>
        </label>
        <small id="model-status">正在读取可用模型…</small>
        <div id="settings-save-actions" class="settings-save-actions" hidden>
          <label class="settings-save-slot">
            <span>存档位</span>
            <select id="settings-save-slot" aria-label="选择存档位">
              <option value="1">存档 1</option>
              <option value="2">存档 2</option>
              <option value="3">存档 3</option>
            </select>
          </label>
          <button id="settings-save" type="button">存档</button>
          <button id="settings-load" type="button">读档</button>
          <small id="settings-save-status" aria-live="polite">正在读取存档…</small>
        </div>
      </div>
    </section>
    <div id="dialogue-blocker" class="dialogue-blocker" hidden aria-hidden="true"></div>
    <section id="ai-dialogue-panel" class="ai-dialogue-panel" hidden>
      <header>
        <div class="dialogue-heading">
          <div class="dialogue-identity">
            <strong id="dialogue-npc-name"></strong>
            <span id="dialogue-npc-title"></span>
          </div>
          <span id="dialogue-affinity" class="dialogue-affinity"></span>
        </div>
        <button id="dialogue-portrait" class="dialogue-portrait-button"
                type="button" aria-label="查看高清立绘" title="查看高清立绘">图</button>
        <button id="dialogue-close" type="button" aria-label="结束对话">×</button>
      </header>
      <div id="dialogue-history" class="dialogue-history"></div>
      <p id="dialogue-status" class="dialogue-status" aria-live="polite"></p>
      <form id="dialogue-form" class="dialogue-form">
        <input id="dialogue-input" type="text" maxlength="500"
               autocomplete="off" placeholder="输入你想说的话">
        <button id="dialogue-send" type="submit">发送</button>
        <button id="dialogue-gift" type="button">赠礼</button>
        <button id="dialogue-breakthrough" type="button">双修突破</button>
        <button id="dialogue-draw" type="button">绘制此刻</button>
      </form>
    </section>
    <section id="ai-image-modal" class="ai-image-modal" hidden>
      <div class="ai-image-content">
        <button id="ai-image-close" type="button" aria-label="关闭图片">×</button>
        <p id="ai-image-status" aria-live="polite"></p>
        <img id="ai-image" alt="" hidden>
      </div>
    </section>
    <section id="portrait-modal" class="ai-image-modal" hidden>
      <div class="ai-image-content">
        <button id="portrait-close" type="button" aria-label="关闭立绘">×</button>
        <p id="portrait-status" aria-live="polite"></p>
        <img id="portrait-image" alt="" hidden>
      </div>
    </section>
    <section id="gift-modal" class="gift-modal" hidden>
      <div class="gift-content">
        <button id="gift-close" class="gift-close" type="button" aria-label="关闭赠礼">×</button>
        <h2>选择赠礼</h2>
        <div id="gift-list" class="gift-list"></div>
        <p id="gift-empty" class="gift-empty" hidden>储物袋中暂无可赠送的物品。</p>
      </div>
    </section>
    <section id="boot-error" class="boot-error" hidden>
      <h1>游戏未能启动</h1>
      <p id="boot-error-message">请刷新后重试。</p>
      <button id="boot-retry" type="button">重新加载</button>
    </section>
  </main>

  <script src="./vendor/phaser.min.js"></script>
  <script src="./src/utils/EventBus.js"></script>
  <script src="./src/utils/SceneTransition.js"></script>
  <script src="./src/systems/TimeSystem.js"></script>
  <script src="./src/ui/SceneBackdrop.js"></script>
  <script src="./src/assets/BuildingAssets.js"></script>
  <script src="./src/assets/EnemyAssets.js"></script>
  <script src="./src/ai/ModelPicker.js"></script>
  <script src="./src/ai/CompletionsSafe.js"></script>
  <script src="./src/ai/ImageWorkflow.js"></script>
  <script src="./src/storage/VersionedStorageUtils.js"></script>
  <script src="./src/storage/VersionedStorage.js"></script>
  <script src="./src/storage/SaveData.js"></script>
  <script src="./src/data/BuildingData.js"></script>
  <script src="./src/data/CultivationData.js"></script>
  <script src="./src/data/ShopData.js"></script>
  <script src="./src/systems/AffinityState.js"></script>
  <script src="./src/systems/AffinitySystem.js"></script>
  <script src="./src/systems/InventorySystem.js"></script>
  <script src="./src/systems/GiftSystem.js"></script>
  <script src="./src/systems/CultivationSystem.js"></script>
  <script src="./src/systems/PlayerGrowthSystem.js"></script>
  <script src="./src/systems/ShopSystem.js"></script>

  <script src="./src/ai/BattleNarrator.js"></script>
  <script src="./src/ai/ExplorationNarrator.js"></script>

  <script src="./src/ui/SaveGameUI.js"></script>

  <script src="./src/systems/NPCSystem.js"></script>
  <script src="./src/systems/DialogueSystem.js"></script>
  <script src="./src/scenes/BootScene.js"></script>
  <script src="./src/scenes/PreloadScene.js"></script>
  <script src="./src/scenes/MainMenuScene.js"></script>
  <script src="./src/scenes/CharacterCreationScene.js"></script>
  <script src="./src/scenes/GameScene.js"></script>
  <script src="./src/scenes/ShopScene.js"></script>
  <script src="./src/scenes/InventoryScene.js"></script>
  <script src="./src/scenes/ExplorationScene.js"></script>
  <script src="./src/scenes/BattleScene.js"></script>
  <script src="./src/scenes/UIScene.js"></script>
  <script src="./main.js"></script>
</body>
</html>
