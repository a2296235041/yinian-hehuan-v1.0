  <script>
    (function installBootPulse(root) {
      'use strict';

      var active = true;
      var timer = 0;
      var payload = { phase: 'start', message: '正在准备游戏' };

      function report() {
        if (!active) return;
        try {
          var loading = root.dzmm && root.dzmm.loading;
          if (loading && typeof loading.progress === 'function') {
            loading.progress(payload);
          }
        } catch (error) {
          console.error('启动状态上报失败:', error.message || '未知错误');
        }
      }

      function schedule() {
        timer = root.setTimeout(function pulse() {
          report();
          schedule();
        }, 2000);
      }

      root.GameBootPulse = {
        progress: function progress(nextPayload) {
          if (!active) return;
          if (nextPayload && typeof nextPayload === 'object') payload = nextPayload;
          report();
        },
        stop: function stop() {
          active = false;
          if (timer) root.clearTimeout(timer);
        }
      };

      report();
      schedule();
    }(window));
  </script>
  <script>
    (function installEarlyBootGuard(root) {
      'use strict';

      var complete = false;
      var timer = 0;

      function finish() {
        complete = true;
        if (timer) root.clearTimeout(timer);
      }

      function fail(message, code) {
        if (complete) return;
        finish();
        root.GameBootPulse?.stop?.();
        var splash = document.getElementById('boot-splash');
        var panel = document.getElementById('boot-error');
        var text = document.getElementById('boot-error-message');
        if (splash) splash.hidden = true;
        if (text) text.textContent = (message || '游戏启动失败') + '，请刷新后重试。';
        if (panel) panel.hidden = false;
        if (!root.PlatformBridge) {
          try {
            root.dzmm?.loading?.error?.(code || 'BOOT_FAILED', message || '游戏启动失败');
          } catch (error) {
            console.error('启动失败状态上报失败:', error.message || '未知错误');
          }
        }
      }

      function reportFailure(message, code) {
        if (root.PlatformBridge?.fail) {
          root.PlatformBridge.fail(code, message);
          return;
        }
        fail(message, code);
      }

      root.GameEarlyBoot = { complete: finish, fail: fail };
      root.addEventListener('error', function onResourceError(event) {
        var target = event.target;
        if (!target || target === root || target.tagName !== 'SCRIPT') return;
        var source = target.getAttribute('src') || '未知脚本';
        reportFailure('关键脚本加载失败：' + source.split('/').pop(), 'SCRIPT_LOAD_FAILED');
      }, true);
      timer = root.setTimeout(function onBootTimeout() {
        reportFailure('启动时间过长，可能是资源网络异常', 'BOOT_TIMEOUT');
      }, 25000);
    }(window));
  </script>
  <style data-critical-boot>
    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #09100e;
    }
    #game-shell, #game-container {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }
    #game-shell { position: relative; overflow: hidden; }
    #game-container { position: absolute; inset: 0; }
    .boot-splash {
      position: absolute;
      z-index: 5;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 14px;
      color: #fff4f7;
      background-color: #09100e;
      background-image: url("./assets/generated/sect-courtyard.c4be5633.webp");
      background-position: center;
      background-size: cover;
      background-blend-mode: multiply;
    }
    .boot-splash[hidden], .boot-error[hidden] { display: none; }
    .boot-splash span {
      display: grid;
      place-items: center;
      width: 78px;
      height: 78px;
      border: 1px solid rgba(232, 183, 199, 0.72);
      border-radius: 50%;
      color: #efd39c;
      background: rgba(25, 10, 17, 0.86);
      font: 20px "STKaiti", "KaiTi", serif;
    }
    .boot-splash strong {
      font: 400 28px "STKaiti", "KaiTi", "Noto Serif SC", serif;
    }
    .boot-splash i {
      width: 220px;
      height: 3px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.14);
    }
    .boot-splash i::after {
      display: block;
      width: 42%;
      height: 100%;
      background: #e78da9;
      content: "";
      animation: boot-flow 1.1s ease-in-out infinite alternate;
    }
    .boot-error {
      position: absolute;
      z-index: 20;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 24px;
      color: #f4ead2;
      text-align: center;
      background: #09100e;
    }
    @keyframes boot-flow {
      from { transform: translateX(-10%); }
      to { transform: translateX(150%); }
    }
  </style>

<body>
  <main id="game-shell">
    <section id="boot-splash" class="boot-splash" aria-label="游戏正在启动">
      <span>合欢</span>
      <strong>正在开启山门</strong>
      <i aria-hidden="true"></i>
    </section>
    <div id="game-container" aria-label="游戏画面"></div>
    <div id="settings-blocker" class="settings-blocker" hidden aria-hidden="true"></div>
    <section id="model-panel" class="model-panel" hidden>
      <button id="model-panel-toggle" class="model-panel-toggle" type="button"
              aria-label="打开设置" aria-controls="model-panel-content"
              aria-expanded="false" title="设置">&#9881;</button>
      <div id="model-panel-content" class="model-panel-content" hidden>
        <header class="settings-heading">
          <strong>设置</strong>
          <button id="settings-close" type="button" aria-label="关闭设置" title="关闭">×</button>
        </header>
        <div class="settings-row">
          <span>
            <b>音乐</b>
            <small id="audio-state">已开启</small>
          </span>
          <label class="settings-switch" title="切换音乐">
            <input id="audio-toggle" type="checkbox" checked aria-label="启用游戏音乐">
            <span class="settings-switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <div class="settings-row">
          <span>
            <b>省流模式</b>
            <small id="traffic-saver-state">已关闭，使用 AI 补充</small>
          </span>
          <label class="settings-switch" title="切换省流模式">
            <input id="traffic-saver-toggle" type="checkbox" aria-label="启用省流模式">
            <span class="settings-switch-track" aria-hidden="true"></span>
          </label>
        </div>
        <div id="traffic-saver-options" class="settings-subgroup" aria-disabled="true">
          <div class="settings-row settings-sub-row">
            <span>
              <b>修炼与时序 AI 补充</b>
              <small id="traffic-cultivation-state">随主开关启用</small>
            </span>
            <label class="settings-switch" title="对修炼与时序 AI 补充启用省流">
              <input id="traffic-cultivation-toggle" type="checkbox" checked
                     aria-label="修炼与时序使用固定文案">
              <span class="settings-switch-track" aria-hidden="true"></span>
            </label>
          </div>
          <div class="settings-row settings-sub-row">
            <span>
              <b>探险 AI 补充</b>
              <small id="traffic-exploration-state">随主开关启用</small>
            </span>
            <label class="settings-switch" title="对探险 AI 补充启用省流">
              <input id="traffic-exploration-toggle" type="checkbox" checked
                     aria-label="探险使用固定文案">
              <span class="settings-switch-track" aria-hidden="true"></span>
            </label>
          </div>
          <div class="settings-row settings-sub-row">
            <span>
              <b>战斗 AI 补充</b>
              <small id="traffic-battle-state">随主开关启用</small>
            </span>
            <label class="settings-switch" title="对战斗 AI 补充启用省流">
              <input id="traffic-battle-toggle" type="checkbox" checked
                     aria-label="战斗使用固定文案">
              <span class="settings-switch-track" aria-hidden="true"></span>
            </label>
          </div>
        </div>
        <small id="traffic-saver-status" aria-live="polite">省流设置会自动保存</small>
        <label class="settings-field">
          <span>对话模型</span>
          <select id="dialogue-model" aria-label="对话模型"></select>
        </label>
        <label class="settings-field">
          <span>画图模型</span>
          <select id="draw-model" aria-label="画图模型"></select>
        </label>
        <small id="model-status" aria-live="polite">正在读取可用模型…</small>
        <div id="settings-save-actions" class="settings-save-actions" hidden>
          <label class="settings-save-slot">
            <span>存档位</span>
            <select id="settings-save-slot" aria-label="选择存档位">
              <option value="1">存档 1</option>
              <option value="2">存档 2</option>
              <option value="3">存档 3</option>
            </select>
          </label>
          <button id="settings-save" type="button">存档</button>
          <button id="settings-load" type="button">读档</button>
          <small id="settings-save-status" aria-live="polite">正在读取存档…</small>
          <button id="settings-auto-load" type="button">读取自动存档</button>
          <small id="settings-auto-status" aria-live="polite">正在读取自动存档…</small>
        </div>
      </div>
    </section>
    <div id="dialogue-blocker" class="dialogue-blocker" hidden aria-hidden="true"></div>
    <section id="ai-dialogue-panel" class="ai-dialogue-panel" hidden>

        <div class="dialogue-heading">

        <div class="dialogue-header-actions">
          <button id="dialogue-portrait" class="dialogue-portrait-button"

          <button id="dialogue-close" class="dialogue-close-button" type="button"
                  aria-label="结束对话并返回场景">返回</button>
        </div>
      </header>

               autocomplete="off" enterkeyhint="send" placeholder="输入你想说的话">
        <button id="dialogue-send" type="button">发送</button>
        <button id="dialogue-gift" type="button">赠礼</button>
        <button id="dialogue-breakthrough" type="button">双修突破</button>
        <button id="dialogue-draw" type="button">绘制此刻</button>
      </div>
    </section>
    <div id="private-group-blocker" class="private-group-blocker" hidden aria-hidden="true"></div>
    <section id="private-group-panel" class="private-group-panel" hidden>
      <header class="private-group-header">
        <div class="private-group-heading">
          <strong>多人互动</strong>
          <span id="private-group-location"></span>
        </div>
        <button id="private-group-close" class="private-group-close" type="button">返回场景</button>
      </header>
      <div id="private-group-participants" class="private-group-participants"></div>
      <div id="private-group-history" class="private-group-history"></div>
      <p id="private-group-status" class="private-group-status" aria-live="polite"></p>
      <div class="private-group-form" role="group" aria-label="多人互动输入">
        <input id="private-group-input" type="text" maxlength="500"
               autocomplete="off" enterkeyhint="send" placeholder="对众人说话或描述行动">
        <button id="private-group-send" type="button">发送</button>
      </div>
    </section>
    <section id="ai-image-modal" class="ai-image-modal" hidden>
      <div class="ai-image-content">
        <button id="ai-image-close" type="button" aria-label="关闭图片">×</button>
        <p id="ai-image-status" aria-live="polite"></p>
        <img id="ai-image" alt="" hidden>
      </div>
    </section>
    <section id="portrait-modal" class="ai-image-modal" hidden>
      <div class="ai-image-content">
        <button id="portrait-close" type="button" aria-label="关闭立绘">×</button>
        <p id="portrait-status" aria-live="polite"></p>

      </div>
    </section>
    <section id="gift-modal" class="gift-modal" hidden>

        <button id="gift-close" class="gift-close" type="button" aria-label="关闭赠礼">×</button>
        <h2>选择赠礼</h2>
        <div id="gift-list" class="gift-list"></div>
        <p id="gift-empty" class="gift-empty" hidden>储物袋中暂无可赠送的物品。</p>
      </div>
    </section>
    <section id="exploration-screen" class="exploration-screen" hidden>
      <header class="exploration-screen-header">
        <div>
          <h1 id="exploration-screen-title">出山探险</h1>
          <p id="exploration-player-info"></p>
        </div>
        <button id="exploration-screen-close" type="button">返回宗门</button>
      </header>
      <main class="exploration-screen-main">
        <p id="exploration-screen-status" class="exploration-screen-status"></p>
        <div id="exploration-region-grid" class="exploration-region-grid"></div>
        <section id="exploration-region-detail" class="exploration-region-detail" hidden>
          <h2 id="exploration-region-name"></h2>
          <p id="exploration-region-description"></p>
          <p id="exploration-region-meta"></p>
          <button id="exploration-region-back" type="button">返回区域</button>
        </section>
      </main>
    </section>
    <section id="exploration-dialogue-panel" class="exploration-dialogue-panel" hidden>
      <header>
        <strong id="exploration-panel-title"></strong>
        <span>灵息未散</span>
      </header>
      <div id="exploration-history" class="exploration-history"></div>
      <p id="exploration-panel-status" class="exploration-panel-status" aria-live="polite"></p>
      <div id="exploration-command-panel" class="exploration-command-panel"

        <input id="exploration-input" type="text" maxlength="500"

        <button id="exploration-submit" type="button">按意图探索</button>
        <button id="exploration-quick" type="button">一键探索</button>
        <button id="exploration-back" type="button" aria-label="返回区域">返回区域</button>
      </div>
    </section>
    <section id="tournament-screen" class="tournament-screen" hidden>

        <div class="tournament-heading">
          <h1 id="tournament-title">宗门大比</h1>
          <p id="tournament-subtitle"></p>
        </div>
        <button id="tournament-close" class="tournament-close" type="button">返回山门</button>
      </header>
      <main class="tournament-layout">
        <aside class="tournament-sidebar">
          <section class="tournament-section">
            <h2>参赛名录</h2>
            <div id="tournament-roster" class="tournament-roster"></div>
          </section>
          <section class="tournament-section">
            <h2>晋级签表</h2>
            <div id="tournament-bracket" class="tournament-bracket"></div>
          </section>
        </aside>
        <section class="tournament-arena">

            <p id="tournament-status" aria-live="polite"></p>
            <strong id="tournament-score" class="tournament-score">三回合累计判定</strong>
          </div>

          <div id="tournament-history" class="tournament-history"></div>

              <button id="tournament-submit" type="button">施展此招</button>
            </div>
            <button id="tournament-advance" type="button" hidden>进入下一轮</button>
            <button id="tournament-claim" type="button" hidden>领取魁首奖励</button>
            <button id="tournament-finish" type="button" hidden>结束本届赛事</button>
          </div>
        </section>
      </main>
    </section>
    <section id="boot-error" class="boot-error" hidden>
      <h1>游戏未能启动</h1>
      <p id="boot-error-message">请刷新后重试。</p>
      <button id="boot-retry" type="button">重新加载</button>
    </section>
